services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portafolio-bolsa-app:latest
    container_name: portafolio-bolsa-app
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    environment:
      - PORT=${PORT:-3002}
      - NODE_ENV=production
      - POCKETBASE_URL=http://pocketbase:8090
      - PB_EXTERNAL_PORT=8091
    depends_on:
      - pocketbase
    restart: unless-stopped
    networks:
      - portafolio-net

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    image: portafolio-bolsa-pocketbase:latest
    container_name: portafolio-bolsa-pocketbase
    ports:
      - "8091:8090"
    volumes:
      - pocketbase_data:/pb_data
    restart: unless-stopped
    networks:
      - portafolio-net

networks:
  portafolio-net:
    driver: bridge

volumes:
  pocketbase_data:
